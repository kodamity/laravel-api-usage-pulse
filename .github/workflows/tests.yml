name: Tests

on:
  push:
    branches:
      - '**'
    paths:
      - '**.php'
      - '.github/workflows/tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    uses: kodamity/.github/.github/workflows/ci-plan.yml@main
    with:
      full-matrix: |
        {
          "php": ["8.3", "8.4"],
          "laravel": ["11.*", "12.*", "13.*"],
          "stability": ["prefer-lowest", "prefer-stable"],
          "include": [
            {"laravel": "11.*", "testbench": "9.*", "carbon": "^2.63"},
            {"laravel": "12.*", "testbench": "10.*", "carbon": "^3.0"},
            {"laravel": "13.*", "testbench": "11.*", "carbon": "^3.0"}
          ]
        }
      reduced-matrix: |
        {
          "include": [
            {"php": "8.3", "laravel": "11.*", "testbench": "9.*", "carbon": "^2.63", "stability": "prefer-lowest"},
            {"php": "8.4", "laravel": "13.*", "testbench": "11.*", "carbon": "^3.0", "stability": "prefer-stable"}
          ]
        }

  tests:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "nesbot/carbon:${{ matrix.carbon }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Setup testbench
        run: |
          cp workbench/.env.example vendor/orchestra/testbench-core/laravel/.env
          cp -r workbench/resources/views/vendor vendor/orchestra/testbench-core/laravel/resources/views/vendor
          cp testbench.example.yaml testbench.yaml

      - name: Execute tests
        run: vendor/bin/pest --ci
